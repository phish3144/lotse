[workspace]
resolver = "2"
members = ["crates/lotse-core", "crates/lotse-cli"]
exclude = ["apps/desktop/src-tauri"]
# apps/desktop/src-tauri wird aufgenommen, sobald die Tauri-Hülle steht (braucht GTK/WebKit zum Bauen).

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license-file = "LICENSE-PENDING"
repository = "https://github.com/phish3144/lotse"

[workspace.dependencies]
lotse-core = { path = "crates/lotse-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
argon2 = { version = "0.5", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
walkdir = "2"
globset = "0.4"
notify = "8"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
dirs = "6"
rpassword = "7"
ureq = { version = "2", features = ["json", "native-certs"] }
ctrlc = "3"

[package]
name = "lotse-core"
description = "Lotse Kern: Datenmodell, verschlüsselter Speicher, Kryptografie, Sync-Client, Projekterkennung, Export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[features]
default = ["native"]
# native: SQLCipher-Speicher, Dateisystem, Beobachter. Ohne dieses Feature bleibt der Kern
# WebAssembly-tauglich (Modell, Krypto, Sync-Umschläge).
native = ["dep:rusqlite", "dep:walkdir", "dep:globset", "dep:notify", "dep:age", "dep:secrecy", "dep:ureq", "dep:lopdf"]
# keychain: Desktop-Schlüssel im OS-Schlüsselbund (Keychain, Credential Manager, Secret Service über zbus).
keychain = ["native", "dep:keyring"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
time.workspace = true
base64.workspace = true
zeroize.workspace = true
argon2.workspace = true
hkdf.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true
rand_core.workspace = true
getrandom.workspace = true
rusqlite = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
globset = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
age = { version = "0.11", optional = true }
secrecy = { version = "0.10", optional = true }
ureq = { workspace = true, optional = true }
# Textauszug aus PDF, für „Datei deuten". Reines Rust, MIT. Ohne Standard-Features:
# ohne rayon und chrono bleibt der Baum klein, und `pdf-extract` bringt über eine ältere
# lopdf-Fassung den unbetreuten `ttf-parser` mit – lopdf 0.45 nutzt dafür `skrifa`.
lopdf = { version = "0.45", optional = true, default-features = false }
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

# Im Browser liefert WebCrypto den Zufall. getrandom 0.2 (RustCrypto) braucht `js`,
# getrandom 0.3 (über ulid/rand) braucht `wasm_js` plus das cfg-Flag in `.cargo/config.toml`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
tempfile = "3"

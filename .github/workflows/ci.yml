name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (Kern + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Modulgrenzen (kein Tresor-Zugriff aus ai/detect/forge/git/kalender/mcp/update/watcher)
        run: scripts/modulgrenzen.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Kern ohne native-Feature (WebAssembly-Tauglichkeit)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p lotse-core --no-default-features --target wasm32-unknown-unknown

  desktop:
    name: Desktop-Hülle (cargo check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web && npm run build --prefix apps/web
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  audit:
    name: Abhängigkeiten prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workspace
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      # Die Tauri-Hülle ist kein Workspace-Mitglied und wurde deshalb lange gar nicht
      # geprüft – eine halbe Abhängigkeitskette ohne Aufsicht. Ihre Ausnahmen stehen
      # kommentiert in deny.toml.
      - name: Tauri-Hülle
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          manifest-path: apps/desktop/src-tauri/Cargo.toml

  web:
    name: Web-Oberfläche
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  sync-worker:
    name: Sync-Dienst
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sync-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/sync-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

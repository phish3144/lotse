name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (Kern + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Modulgrenzen (kein Tresor-Zugriff aus ai/detect/forge/git/kalender/mcp/update/watcher)
        run: scripts/modulgrenzen.sh
      # Liest die tatsaechliche Oberflaeche aus dem Quelltext und verlangt, dass jedes
      # Kommando, Feld, Fehlertext und Schalter im Wiki vorkommt. »Wird bei jedem Update
      # mitgezogen« ist als Vorsatz wertlos; so wird es rot, wenn es nicht stimmt.
      - name: Wiki deckt die Oberflaeche ab
        run: scripts/wiki_pruefen.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Kern ohne native-Feature (WebAssembly-Tauglichkeit)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p lotse-core --no-default-features --target wasm32-unknown-unknown

  wasm:
    name: WASM-Anbindung im Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p lotse-wasm --target wasm32-unknown-unknown -- -D warnings
      # wasm-bindgen muss genau zur Fassung im Cargo.lock passen, sonst entsteht eine
      # Anbindung, die erst zur Laufzeit auffällt. Die Fassung wird deshalb aus dem Lock
      # gelesen, nicht hier eingetragen – scripts/wasm-bauen.sh prüft das noch einmal.
      - name: wasm-bindgen holen
        run: |
          set -euo pipefail
          fassung="$(awk '/^name = "wasm-bindgen"$/ { g = 1; next }
                          g && /^version = / { gsub(/[",]/, "", $3); print $3; exit }' Cargo.lock)"
          echo "wasm-bindgen $fassung"
          datei="wasm-bindgen-$fassung-x86_64-unknown-linux-musl"
          curl -sSfL -o wb.tar.gz \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$fassung/$datei.tar.gz"
          tar xzf wb.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv "$datei/wasm-bindgen" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: scripts/wasm-bauen.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Ein echter Browser, kein Mock: derselbe Vektor wie im nativen Test
      # crates/lotse-core/tests/kdf_vektoren.rs. Das ist das Abschlusskriterium der
      # Phase W1 aus docs/WEB_CLIENT.md.
      - name: Vektoren im Browser
        working-directory: apps/web
        run: node scripts/wasm-browsertest.mjs
      # Kleine Menge, damit der Weg nicht verrottet und der Umschlag-Aufschlag nicht
      # unbemerkt wegläuft. Die großen Läufe (500 000) sind Handarbeit auf Abruf; ihre
      # Ergebnisse stehen in docs/WEB_CLIENT.md 4a.
      - name: Mengentest (kleine Menge)
        working-directory: apps/web
        run: node scripts/wasm-mengentest.mjs 2000

  desktop:
    name: Desktop-Hülle (cargo check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web && npm run build --prefix apps/web
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  audit:
    name: Abhängigkeiten prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workspace
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      # Die Tauri-Hülle ist kein Workspace-Mitglied und wurde deshalb lange gar nicht
      # geprüft – eine halbe Abhängigkeitskette ohne Aufsicht. Ihre Ausnahmen stehen
      # kommentiert in deny.toml.
      - name: Tauri-Hülle
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          manifest-path: apps/desktop/src-tauri/Cargo.toml

  web:
    name: Web-Oberfläche
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Prueft nur, was im Browser landet. Werkzeuge (Vite, Vitest, svelte-check)
      # laufen auf dem Entwicklerrechner und werden nie ausgeliefert; eine Meldung
      # dort ist etwas anderes als eine im Bundle. Siehe docs/ABHAENGIGKEITEN.md.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build

  sync-worker:
    name: Sync-Dienst
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sync-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/sync-worker/package-lock.json
      - run: npm ci
      # Der Worker hat null Laufzeit-Abhaengigkeiten: ausgeliefert wird nur eigener
      # Code. Genau das prueft diese Zeile - und sie wird rot, sobald jemand eine
      # Laufzeit-Abhaengigkeit mit Meldung hinzufuegt. Siehe docs/ABHAENGIGKEITEN.md.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test

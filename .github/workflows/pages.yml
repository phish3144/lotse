name: Landing Page

# Veröffentlicht `site/` auf GitHub Pages. Voraussetzung: In den Repo-Einstellungen unter
# Pages die Quelle "GitHub Actions" wählen. Auf einem kostenlosen Konto muss das Repository
# dafür öffentlich sein; alternativ lässt sich `site/` unverändert auf Cloudflare Pages legen.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  # Nach einem Release. Nötig, weil der Release-Ablauf `site/latest.json` mit dem
  # GITHUB_TOKEN nach main schiebt – und ein Push mit diesem Token loest keinen
  # Workflow aus. Ohne diesen Auslöser blieb die Adresse, in der der Updater zuerst
  # nachsieht, bis zur nächsten unabhängigen Änderung an `site/` auf dem alten Stand.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Ein gescheitertes Release hat nichts zu veröffentlichen.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Bei `workflow_run` zeigt der Standard-Ref auf den Commit, der das Release
          # ausgelöst hat – also auf den Stand *vor* dem Spiegel-Commit. Hier soll der
          # Kopf von main veröffentlicht werden, samt der gerade eingetragenen Liste.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      # Deployt heisst nicht ausgeliefert. Genau das ging bei 0.6.0 und 0.6.1 schief: die
      # Datei lag im Repo, die Adresse antwortete mit 404, und niemandem fiel es auf.
      # Diese Pruefung gehoert hierher und nicht in `release.yml` – dort muesste sie auf
      # einen Deploy warten, den erst das Ende jenes Laufs ausloest.
      - name: Liefert die Adresse wirklich den eingecheckten Stand?
        run: |
          set -uo pipefail
          if [ ! -f site/latest.json ]; then
            echo "Keine site/latest.json im Baum - nichts nachzufassen."
            exit 0
          fi
          soll=$(python3 -c "import json;print(json.load(open('site/latest.json')).get('version',''))")
          if [ -z "$soll" ]; then
            echo "::error::site/latest.json nennt keine Fassung."
            exit 1
          fi
          adresse=https://lotse.sanctora.eu/latest.json
          for versuch in $(seq 1 15); do
            ist=$(curl -fsSL --max-time 20 "$adresse" 2>/dev/null \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('version',''))" 2>/dev/null) || ist=""
            if [ "$ist" = "$soll" ]; then
              echo "$adresse liefert $ist - deckungsgleich mit dem Repo."
              exit 0
            fi
            echo "Noch nicht da (erwartet $soll, bekommen \"${ist:-nichts}\"), warte 20 s ... ($versuch/15)"
            sleep 20
          done
          echo "::error::${adresse} liefert nicht ${soll}."
          echo "Das ist die Adresse, in der der Updater ZUERST nachsieht. Stimmt sie nicht,"
          echo "findet keine installierte Fassung ein Update."
          echo ""
          echo "Zu pruefen:"
          echo "  1. Settings > Pages: Custom domain = lotse.sanctora.eu, Quelle GitHub Actions"
          echo "  2. Settings > Environments > github-pages: ist main als Branch erlaubt?"
          echo "  3. Loest lotse.sanctora.eu noch auf 185.199.x.x auf?"
          exit 1

name: Landing Page

# Veröffentlicht `site/` auf GitHub Pages. Voraussetzung: In den Repo-Einstellungen unter
# Pages die Quelle "GitHub Actions" wählen. Auf einem kostenlosen Konto muss das Repository
# dafür öffentlich sein; alternativ lässt sich `site/` unverändert auf Cloudflare Pages legen.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

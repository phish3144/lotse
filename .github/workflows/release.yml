name: Release

# Baut bei einem Tag `v*` die Desktop-Installer (Tauri) und die Kommandozeile für Windows,
# macOS und Linux und hängt sie an ein GitHub-Release.
#
# Die Desktop-Bauten werden mit dem Update-Schlüssel signiert (minisign – nicht zu
# verwechseln mit Code-Signierung: Windows SmartScreen und macOS Gatekeeper warnen
# weiterhin). Diese Signatur ist die Bedingung dafür, dass die App sich selbst
# austauschen darf – ohne sie wäre der Updater ein bequemer Weg für jeden, der die
# Verbindung oder das Konto kontrolliert.
#
# Die Releases bleiben Vorabversionen. GitHub lässt die aber aus `/releases/latest`
# heraus – über diese Adresse fände der Updater also nie etwas. Deshalb spiegelt der
# Job `pages` die fertige `latest.json` zusätzlich auf die Landing Page, und die App
# fragt dort zuerst (siehe `plugins.updater.endpoints` in tauri.conf.json).
#
# Auslösen: git tag v0.1.0 && git push origin v0.1.0
# oder von Hand unter Actions mit dem gewünschten Tag; das Release legt den Tag dann an.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag für das Release, z. B. v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  schluessel:
    name: Update-Schlüssel vorhanden?
    runs-on: ubuntu-22.04
    steps:
      - name: Nachsehen
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Das Geheimnis TAURI_SIGNING_PRIVATE_KEY fehlt."
            echo "Ohne Update-Schlüssel entstehen Bauten ohne Signatur, und der Updater"
            echo "weist sie ab - ein Release davon waere eine Sackgasse."
            echo ""
            echo "Einmalig anlegen:"
            echo "  npm exec -- @tauri-apps/cli signer generate -w lotse-updater.key"
            echo "Dann unter Settings > Secrets and variables > Actions hinterlegen:"
            echo "  TAURI_SIGNING_PRIVATE_KEY          = Inhalt von lotse-updater.key"
            echo "  TAURI_SIGNING_PRIVATE_KEY_PASSWORD = das dabei vergebene Passwort"
            echo "Und den oeffentlichen Schluessel (lotse-updater.key.pub) in"
            echo "apps/desktop/src-tauri/tauri.conf.json unter plugins.updater.pubkey eintragen."
            exit 1
          fi
          echo "Privater Schluessel liegt vor."

      - uses: actions/checkout@v4
      - name: Oeffentlichen Schluessel nachsehen
        run: |
          # Ein Platzhalter hier wuerde nicht den Bau brechen, sondern still einen
          # Updater ausliefern, der jede Fassung abweist. Also hier abfangen.
          PUB=$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['plugins']['updater']['pubkey'])")
          case "$PUB" in
            ""|SIGNIERSCHLUESSEL_FEHLT_NOCH)
              echo "::error::In tauri.conf.json steht noch kein oeffentlicher Update-Schluessel."
              echo "Inhalt von lotse-updater.key.pub dort unter plugins.updater.pubkey eintragen."
              exit 1
              ;;
          esac
          echo "Oeffentlicher Schluessel eingetragen."

  cli:
    needs: schluessel
    name: CLI ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Bauen
        run: cargo build --release -p lotse-cli --target ${{ matrix.target }}
      - name: Packen (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          name="lotse-cli-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p dist/"$name"
          cp target/${{ matrix.target }}/release/lotse dist/"$name"/
          cp README.md docs/CONCEPT.md docs/THREAT_MODEL.md dist/"$name"/
          (cd dist && tar czf "$name.tar.gz" "$name")
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Packen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "lotse-cli-$env:RELEASE_TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lotse.exe" "dist/$name/"
          Copy-Item README.md, docs/CONCEPT.md, docs/THREAT_MODEL.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Lotse ${{ env.RELEASE_TAG }}"
          prerelease: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  desktop:
    name: Desktop ${{ matrix.platform }} ${{ matrix.args }}
    # Erst nach der CLI, damit nur ein Job das Release anlegt und der andere es findet.
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: desktop-${{ matrix.platform }}-${{ matrix.args }}
      - name: Linux-Abhängigkeiten
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix apps/desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signiert die Update-Artefakte. Der zugehörige öffentliche Schlüssel steht
          # in tauri.conf.json; nur was dazu passt, tauscht die App gegen sich selbst.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Lotse ${{ env.RELEASE_TAG }}"
          releaseBody: |
            Frühe Fassung. Die Installer sind **nicht code-signiert**: Windows SmartScreen
            und macOS Gatekeeper warnen beim ersten Start. Prüfsummen liegen als
            `.sha256`-Dateien bei.

            Ab dieser Fassung aktualisiert sich Lotse selbst: es lädt die neue Fassung,
            prüft ihre Signatur gegen den eingebauten öffentlichen Schlüssel und tauscht
            sich aus. Aus einem `.deb` oder `.rpm` heraus nicht – dort aktualisiert die
            Paketverwaltung.

            Der Wiederherstellungscode und der Desktop-Schlüssel werden beim Einrichten
            genau einmal angezeigt.
          releaseDraft: false
          # Die Datei, in der der Updater nachsieht. Jeder Bau-Job trägt seine Plattform
          # nach; die Aktion liest die vorhandene und führt zusammen.
          uploadUpdaterJson: true

  # Die fertige `latest.json` auf die Landing Page spiegeln. Nötig, weil die Releases
  # Vorabversionen sind und GitHub die aus `/releases/latest` heraushält – die App
  # fragt deshalb zuerst die Seite und erst danach GitHub.
  pages:
    name: latest.json auf die Seite spiegeln
    needs: desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Holen und eintragen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            | python3 -c "
          import json,sys
          for a in json.load(sys.stdin)['assets']:
              if a['name'] == 'latest.json':
                  print(a['url']); break
          ")
          if [ -z "$url" ]; then
            echo "::error::Im Release ${RELEASE_TAG} liegt keine latest.json."
            echo "Ohne sie findet der Updater nichts. Haben die Desktop-Jobs signiert gebaut?"
            exit 1
          fi
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o site/latest.json "$url"
          # Lieber hier merken als beim Nutzer: eine kaputte Datei wäre ein stiller Ausfall.
          python3 -c "
          import json,sys
          d = json.load(open('site/latest.json'))
          if not d.get('platforms'):
              sys.exit('latest.json enthält keine Plattformen')
          print('Plattformen:', ', '.join(sorted(d['platforms'])))
          "

      - name: Einchecken
        run: |
          set -euo pipefail
          if git diff --quiet -- site/latest.json; then
            echo "Unverändert, nichts zu tun."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/latest.json
          git commit -m "latest.json für ${RELEASE_TAG}"
          # Zwischen Prüfen und Schieben kann jemand anders gepusht haben.
          for versuch in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push abgelehnt, hole nach (Versuch $versuch)…"
            git pull --rebase origin main
            sleep $((versuch * 3))
          done
          echo "::error::latest.json ließ sich nicht nach main schieben."
          exit 1
          prerelease: true
          args: ${{ matrix.args }}

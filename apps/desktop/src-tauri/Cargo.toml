[package]
name = "lotse-desktop"
description = "Lotse Desktop-Hülle (Tauri 2)"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license-file = "../../../LICENSE-PENDING"
repository = "https://github.com/phish3144/lotse"
# Wie jedes andere Crate hier: nichts davon gehört nach crates.io. Fehlte bisher, weil
# dieses Crate kein Workspace-Mitglied ist und die Vorgabe daher nicht geerbt hat –
# `cargo deny` hat es gemeldet, sobald die Hülle mitgeprüft wurde.
publish = false

# Bewusst kein Workspace-Mitglied: braucht GTK/WebKit (Linux), Xcode (macOS) bzw. WebView2
# (Windows) zum Bauen. Aufnahme in den Workspace, sobald die CI diese Abhängigkeiten hat.

[lib]
name = "lotse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lotse-core = { path = "../../../crates/lotse-core", features = ["keychain"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Echter Updater: lädt die signierte Fassung und tauscht sich selbst aus. Ohne
# Signaturprüfung wäre das ein bequemer Weg für jeden, der die Verbindung oder das
# Konto kontrolliert – deshalb hängt alles am öffentlichen Schlüssel in tauri.conf.json.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
zeroize = "1"

name = "lotse-sync-worker"
main = "src/index.ts"
compatibility_date = "2026-08-22"

# --- Free-plan limits (see docs/SYNC_PROTOCOL.md section 8) ---------------
#
# | Grenze                    | Wert           | Folge im Design                              |
# |----------------------------|----------------|-----------------------------------------------|
# | D1 Schreibvorgänge/Tag     | 100 000 Zeilen | Client batcht (Debounce 2 s), ein Push = eine |
# |                             |                | D1-Transaktion (db.batch) fuer alle Records.   |
# | D1 Lesevorgänge/Tag        | 5 000 000 Zeilen | Pull nutzt den Index `records_seq`, kein     |
# |                             |                | Full-Table-Scan.                               |
# | Worker-Anfragen/Tag         | 100 000        | Sync-Intervall im Leerlauf 5 min ≈ 300         |
# |                             |                | Anfragen/Tag/Gerät.                            |
# | Worker-CPU/Anfrage          | 10 ms          | Kein Argon2id im Worker. Server hasht          |
# |                             |                | `auth_key`/`recovery_auth_key` mit PBKDF2-     |
# |                             |                | SHA256 (600 000 Iterationen) ueber WebCrypto;  |
# |                             |                | die eigentliche Sicherheit traegt das          |
# |                             |                | clientseitige Argon2id.                        |
# | R2 Speicher                 | 10 GB          | Anhaenge > 25 MB werden clientseitig nur       |
# |                             |                | referenziert, nicht automatisch hochgeladen.   |
#
# Auth-Endpunkte werden bewusst NICHT im Worker-Code rate-limitiert (siehe
# src/auth.ts) -- das gehoert vor den Worker: Cloudflare WAF Rate Limiting
# Rules auf /v1/auth/* (Dashboard oder `wrangler` Rulesets API), da das
# Gratisplan-Budget an CPU-Zeit sonst durch PBKDF2-Berechnungen von
# Angreifern aufgebraucht werden kann.

[[d1_databases]]
binding = "DB"
database_name = "lotse"
database_id = "6b05b944-ba40-400d-9d9d-112a8f14e977" # angelegt 2026-09-13, Standort WEUR
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "lotse-blobs"
# Anhänge bleiben in der EU. `jurisdiction` ist strenger als ein Standort-Hinweis: es
# garantiert Speicherung *und* Verarbeitung dort. Nach dem Anlegen nicht mehr änderbar –
# der Eimer muss deshalb mit `--jurisdiction eu` erzeugt werden (siehe README).
jurisdiction = "eu"

[observability]
enabled = true
